name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

      db_single_tenant:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_single_tenant
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_single_tenant"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      # The embedding and reranking models are pulled from Hugging Face at a
      # revision pinned in src/rag/embedding.py / src/rag/retrieval/rerank.py.
      # Caching keyed on those files means a run only re-downloads when the
      # pinned revision actually changes, instead of on every push - so CI
      # doesn't go red for a slow network on an unrelated code change.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: >-
            hf-models-${{ hashFiles('src/rag/embedding.py',
            'src/rag/retrieval/rerank.py') }}

      - name: Install dependencies
        run: uv sync

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Apply migrations to the main database
        run: |
          uv run python -c "
          from pathlib import Path
          import psycopg
          dsn = 'host=localhost port=55432 dbname=rag user=postgres password=postgres'
          with psycopg.connect(dsn, autocommit=True) as conn:
              for path in sorted(Path('migrations').glob('*.sql')):
                  conn.execute(path.read_text())
          "

      - name: Ingest the corpus (both tenants, both chunk profiles)
        run: |
          uv run ingest corpus/meridian --tenant meridian --profile 512
          uv run ingest corpus/halcyon --tenant halcyon --profile 512
          uv run ingest corpus/meridian --tenant meridian --profile 1024
          uv run ingest corpus/halcyon --tenant halcyon --profile 1024

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        run: uv run pytest tests/integration -q

      # Obligatory gate (RAG-18, RAG-19): the whole workflow fails the moment a
      # single cross-tenant question leaks a chunk it should never see.
      - name: Isolation suite (obligatory gate)
        run: uv run pytest tests/isolation -q
