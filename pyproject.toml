[project]
name = "tenant-scoped-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
]

[project.scripts]
ingest = "rag.ingest:main"
rag-server = "rag.server:main"
rag-eval = "eval.harness:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
